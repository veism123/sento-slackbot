# Paste this at api.slack.com/apps → Create New App → From a manifest.
#
# This is the Socket Mode version: the bot dials out to Slack, so there is no
# public URL to arrange. Right for running it on your own Slack.
#
# To make the app installable by other workspaces later, Slack requires the
# HTTP transport instead: set socket_mode_enabled to false, and add
#   event_subscriptions.request_url: https://YOUR-PUBLIC-URL/slack/events
display_information:
  name: Sento
  description: Reads and writes your team's Midland context layer from Slack.
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: Sento
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read   # see the mentions addressed to it
      - chat:write          # reply in thread
      - channels:history    # read the conversation it was tagged in (public channels)
      - groups:history      # same, for private channels
      - reactions:write     # eyes on receipt, check mark when something was written
      - users:read          # resolve a user id to a handle, for attribution
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
